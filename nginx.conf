# ─────────────────────────────────────────────────────────────────────────────
# reusa-lex-ui — nginx runtime config
# Modelled on web-kore-standalone/nginx.conf, with one addition Kore does not
# need: CORS. Kore is same-origin (bundled into the Angular app); the Lex
# loader XHRs its config across origins, and a non-200 rejects the whole load.
# ─────────────────────────────────────────────────────────────────────────────
# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ OPEN QUESTIONS                                                            ║
# ╠═══════════════════════════════════════════════════════════════════════════╣
# ║ Q5  @SERVICE_PORT@   Kore = 9017. What should Lex listen on?
# ║ Q3  @URL_PATH@       Empty for the web root, or "/lexui" for a prefix.
# ║ Q2  @PARENT_ORIGIN@  Substituted into Access-Control-Allow-Origin below.
# ║                      Must exactly match the Angular app origin — scheme,
# ║                      host and port. A wildcard "*" is NOT acceptable here:
# ║                      this endpoint serves Cognito pool ids.
# ╚═══════════════════════════════════════════════════════════════════════════╝
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    gzip            on;
    gzip_types      application/javascript application/json text/css;
    gzip_min_length 1024;

    server {
        listen       @SERVICE_PORT@;
        server_name  localhost;

        # k8s liveness probe target
        location /healthcheck {
            access_log off;
            return 200 "OK\n";
        }

        location @URL_PATH@/ {
            root /usr/share/nginx/html;
            index index.html;

            # The Angular app fetches lex-web-ui-loader-config.json from this
            # origin. Without CORS the fetch fails and nothing renders.
            add_header Access-Control-Allow-Origin  "@PARENT_ORIGIN@" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS"    always;
            add_header Access-Control-Allow-Headers "Content-Type"    always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            # Never cache the config or the iframe entry page - both must
            # reflect the values substituted at container start.
            location ~* /(lex-web-ui-loader-config\.json|index\.html)$ {
                add_header Access-Control-Allow-Origin "@PARENT_ORIGIN@" always;
                add_header Cache-Control "no-store, must-revalidate" always;
            }

            # Fingerprint-free bundles: short cache, revalidated.
            location ~* \.(js|css|png|svg|woff2?)$ {
                add_header Access-Control-Allow-Origin "@PARENT_ORIGIN@" always;
                add_header Cache-Control "public, max-age=300" always;
            }
        }

        # The chat is not a SPA with client-side routes; a miss is a real 404
        # and should look like one rather than silently returning index.html.
        error_page 404 /404.html;

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
